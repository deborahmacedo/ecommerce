name: Workflow 1 - Build

on:
  push:
    branches:
      - 'feature/**'

jobs:
  build:
    name: Build Back-end e Front-end
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Instalar dependências do back-end
        run: pip install -r backend/requirements.txt

      - name: Build e checagem sintática do back-end
        run: python -m compileall -f -q backend/src

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependências do front-end
        working-directory: frontend
        run: npm ci

      - name: Build do front-end
        working-directory: frontend
        run: npm run build